<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Packup</title><style>body{font:14px Segoe UI;background:#f4f6f8;color:#17212b;margin:0}main{max-width:1100px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #dfe4e8;border-radius:8px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;margin:8px 0 4px;font-weight:600}input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #bbc4cc;border-radius:4px}button{background:#0b6e99;color:#fff;border:0;border-radius:4px;padding:8px 12px;margin:8px 4px 0 0;cursor:pointer}.secondary{background:#e8eef2;color:#17212b}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #edf0f2;padding:8px}.ok{color:#147d4a}.bad{color:#b42318}pre{background:#101820;color:#d6e2ea;padding:10px;max-height:220px;overflow:auto}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Auto Packup</h1><div class="grid"><section class="panel"><h2>运行状态</h2><strong id="state">加载中</strong><p id="next"></p><button onclick="runNow()">立即备份</button><button class="secondary" onclick="cancelRun()">取消</button></section><section class="panel"><h2>备份设置</h2><label>源目录</label><input id="source"><label>备份目录</label><input id="backup"><label>间隔（分钟）</label><input id="interval" type="number" min="1" max="1440"><button onclick="saveConfig()">保存</button><span id="msg"></span></section></div><section class="panel"><h2>备份历史</h2><div style="overflow:auto"><table><thead><tr><th>时间</th><th>状态</th><th>耗时</th><th>文件</th><th>大小</th><th>操作</th></tr></thead><tbody id="runs"></tbody></table></div></section><section class="panel"><h2>日志</h2><pre id="logs"></pre></section></main><script>const $=x=>document.getElementById(x),api=async(u,o)=>{let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.statusText);return j},dur=ms=>{if(!ms)return '-';let s=Math.floor(ms/1000);return s<60?s+' 秒':Math.floor(s/60)+' 分 '+s%60+' 秒'},bytes=n=>n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';async function load(){let[c,s,r,l]=await Promise.all([api('/api/config'),api('/api/status'),api('/api/backups'),api('/api/logs')]);$('source').value=c.sourceDirectory;$('backup').value=c.backupDirectory;$('interval').value=c.intervalMinutes;$('state').textContent=s.isRunning?'备份进行中':s.isQueued?'排队中':'空闲';$('state').className=s.lastError?'bad':'ok';$('next').textContent=s.nextRunAt?'下次执行：'+new Date(s.nextRunAt).toLocaleString():(s.lastError||'');$('runs').innerHTML=r.map(x=>'<tr><td>'+new Date(x.startedAt).toLocaleString()+'</td><td class="'+(x.status==='Succeeded'?'ok':'bad')+'">'+x.status+'</td><td>'+dur(x.durationMs)+'</td><td>'+x.fileCount+'</td><td>'+bytes(x.bytesCopied)+'</td><td>'+(x.status==='Succeeded'?'<button class="secondary" onclick="restore('+x.id+')">恢复</button>':'')+'</td></tr>').join('');$('logs').textContent=l.map(x=>'['+new Date(x.timestamp).toLocaleString()+'] '+x.level+': '+x.message).join('\n')}async function saveConfig(){try{await api('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceDirectory:$('source').value,backupDirectory:$('backup').value,intervalMinutes:+$('interval').value})});$('msg').textContent='已保存'}catch(e){$('msg').textContent=e.message}}async function runNow(){try{await api('/api/backups/run',{method:'POST'});load()}catch(e){alert(e.message)}}async function cancelRun(){await api('/api/backups/cancel',{method:'POST'});load()}async function restore(id){let d=prompt('恢复到目录：');if(d)try{alert((await api('/api/backups/'+id+'/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({destination:d})})).message)}catch(e){alert(e.message)}}load();setInterval(load,5000)</script></body></html>
